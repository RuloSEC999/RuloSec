<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuloSec - Radar de Intercepción</title>
    <style>
        /* ================================================
           PALETA QUETZALCÓATL · OBSIDIANA + JADE + ORO
           ================================================ */
        :root {
            --jade:        #00e676;
            --jade-dim:    #00a152;
            --jade-dark:   #003d1f;
            --jade-glow:   rgba(0, 230, 118, 0.12);
            --gold:        #c9a227;
            --gold-dim:    #6b5510;
            --gold-glow:   rgba(201, 162, 39, 0.12);
            --obsidian:    #070b08;
            --stone:       #0e160f;
            --stone-mid:   #182018;
            --text-main:   #9ef5c0;
            --text-dim:    #4a7a5a;
            --danger:      #ff4444;
            --purple:      #9d6fff;
            --purple-dark: #1e0a35;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at 50% 22%,
                #0d1e0f 0%,
                #070f08 35%,
                #030704 65%,
                #010301 100%);
            color: var(--jade);
            font-family: 'Courier New', monospace;
            padding: 28px 20px 60px;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Cuadrícula tipo códice prehispánico */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,230,118,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,230,118,0.03) 1px, transparent 1px),
                linear-gradient(rgba(201,162,39,0.013) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,162,39,0.013) 1px, transparent 1px);
            background-size: 64px 64px, 64px 64px, 16px 16px, 16px 16px;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanlines — efecto monitor CRT / jade resplandor lateral */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.09) 2px,
                    rgba(0,0,0,0.09) 3px
                ),
                radial-gradient(ellipse 80% 60% at 50% 0%,
                    rgba(0,180,80,0.055) 0%,
                    transparent 100%),
                radial-gradient(ellipse 50% 20% at 50% 100%,
                    rgba(201,162,39,0.025) 0%,
                    transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 820px;
            position: relative;
            z-index: 10;
        }

        /* ================================================
           CABECERA
           ================================================ */
        .rs-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .rs-eyebrow {
            color: var(--gold);
            font-size: 0.72em;
            letter-spacing: 7px;
            opacity: 0.65;
            margin-bottom: 10px;
        }

        /* Glitch — colores actualizados, estructura idéntica al original */
        .glitch {
            position: relative;
            color: var(--jade);
            font-size: 1.85em;
            text-align: center;
            text-shadow: 0 0 18px rgba(0,230,118,0.4);
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--obsidian);
        }
        .glitch::before {
            left: 3px;
            text-shadow: -2px 0 var(--gold);
            clip: rect(44px, 800px, 56px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -3px;
            text-shadow: -2px 0 #00fff9;
            clip: rect(44px, 800px, 56px, 0);
            animation: glitch-anim2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0%   { clip: rect(12px, 9999px, 59px, 0); transform: skew(0.8deg); }
            20%  { clip: rect(80px, 9999px,  6px, 0); transform: skew(0.6deg); }
            40%  { clip: rect(55px, 9999px, 82px, 0); transform: skew(0.4deg); }
            60%  { clip: rect(88px, 9999px, 41px, 0); transform: skew(0.2deg); }
            80%  { clip: rect(47px, 9999px, 50px, 0); transform: skew(0.5deg); }
            100% { clip: rect( 7px, 9999px, 52px, 0); transform: skew(0.9deg); }
        }
        @keyframes glitch-anim2 {
            0%   { clip: rect(65px, 9999px,100px, 0); transform: skew(0.5deg); }
            20%  { clip: rect(67px, 9999px, 61px, 0); transform: skew(0.8deg); }
            40%  { clip: rect(40px, 9999px, 49px, 0); transform: skew(0.9deg); }
            60%  { clip: rect(21px, 9999px, 33px, 0); transform: skew(0.8deg); }
            80%  { clip: rect(63px, 9999px, 25px, 0); transform: skew(0.4deg); }
            100% { clip: rect(77px, 9999px, 19px, 0); transform: skew(0.5deg); }
        }

        /* ================================================
           DIVISORES ESTILO GRECAS
           ================================================ */
        .greca {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
        }
        .greca::before, .greca::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
        }
        .greca-label {
            color: var(--gold);
            font-size: 0.7em;
            letter-spacing: 5px;
            opacity: 0.6;
            white-space: nowrap;
        }

        /* ================================================
           PANEL GENÉRICO — esquinas escalonadas (azteca)
           ================================================ */
        .panel {
            background: var(--stone);
            border: 1px solid var(--jade-dark);
            position: relative;
            clip-path: polygon(
                14px 0%,   calc(100% - 14px) 0%,
                100% 14px, 100% calc(100% - 14px),
                calc(100% - 14px) 100%, 14px 100%,
                0% calc(100% - 14px), 0% 14px
            );
        }
        /* Borde interior dorado tenue */
        .panel::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px solid var(--gold-dim);
            clip-path: polygon(
                10px 0%,   calc(100% - 10px) 0%,
                100% 10px, 100% calc(100% - 10px),
                calc(100% - 10px) 100%, 10px 100%,
                0% calc(100% - 10px), 0% 10px
            );
            opacity: 0.25;
            pointer-events: none;
        }

        /* ================================================
           TRAMPA DE LOGIN
           ================================================ */
        .login-trap {
            padding: 22px 24px 20px;
            margin-bottom: 24px;
        }
        .trap-title {
            color: var(--danger);
            text-align: center;
            font-weight: bold;
            font-size: 0.82em;
            letter-spacing: 5px;
            margin-bottom: 18px;
            text-shadow: 0 0 12px rgba(255,68,68,0.4);
        }
        .login-trap input {
            display: block;
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 10px;
            background: var(--obsidian);
            border: 1px solid var(--jade-dim);
            color: var(--jade);
            font-family: 'Courier New', monospace;
            font-size: 0.93em;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-trap input:focus {
            border-color: var(--jade);
            box-shadow: 0 0 10px var(--jade-glow);
        }
        .login-trap input::placeholder { color: var(--text-dim); }

        .btn-login-disabled {
            display: block;
            width: 100%;
            padding: 10px;
            background: var(--stone-mid);
            border: 1px solid #1e2e1e;
            color: #2e4e3e;
            font-family: 'Courier New', monospace;
            font-size: 0.88em;
            cursor: not-allowed;
            letter-spacing: 3px;
            text-align: center;
        }

        /* ================================================
           BOTONES DE MÓDULOS
           ================================================ */
        button {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 14px 20px;
            font-size: 0.9em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            position: relative;
            transition: filter 0.15s, transform 0.15s;
            clip-path: polygon(
                8px 0%,   calc(100% - 8px) 0%,
                100% 8px, 100% calc(100% - 8px),
                calc(100% - 8px) 100%, 8px 100%,
                0% calc(100% - 8px), 0% 8px
            );
        }
        button:not(.btn-login-disabled):hover {
            filter: brightness(1.18);
            transform: translateX(3px);
        }

        #btn-ip {
            background: linear-gradient(90deg, #0a2516 0%, #0d2b1a 100%);
            color: var(--jade);
            border-left: 3px solid var(--jade);
            text-align: left;
        }
        #btn-ip::before { content: '// '; color: var(--jade-dim); }

        #btn-escaner {
            background: linear-gradient(90deg, #140a25 0%, #1e0a35 100%);
            color: var(--purple);
            border-left: 3px solid var(--purple);
            text-align: left;
        }
        #btn-escaner::before { content: '// '; color: #5a3a8a; }

        #btn-webrtc {
            background: linear-gradient(90deg, #1e1400 0%, #2b1a00 100%);
            color: var(--gold);
            border-left: 3px solid var(--gold);
            text-align: left;
        }
        #btn-webrtc::before { content: '// '; color: var(--gold-dim); }

        /* ================================================
           CANVAS QUETZALCÓATL — INTOCABLE
           ================================================ */
        #canvas-container {
            pointer-events: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
        }

        /* ================================================
           RADAR — CALENDARIO AZTECA
           ================================================ */
        #radar-wrapper {
            margin-top: 20px;
            background: var(--stone);
            border: 1px solid var(--jade-dark);
            padding: 20px;
            display: flex;
            gap: 18px;
            clip-path: polygon(
                14px 0%,   calc(100% - 14px) 0%,
                100% 14px, 100% calc(100% - 14px),
                calc(100% - 14px) 100%, 14px 100%,
                0% calc(100% - 14px), 0% 14px
            );
            position: relative;
        }
        #radar-wrapper::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px solid var(--gold-dim);
            clip-path: polygon(
                10px 0%, calc(100% - 10px) 0%,
                100% 10px, 100% calc(100% - 10px),
                calc(100% - 10px) 100%, 10px 100%,
                0% calc(100% - 10px), 0% 10px
            );
            opacity: 0.2;
            pointer-events: none;
        }

        #radar-circular-container {
            position: relative;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #001a0d 0%, #000a05 55%, #000000 100%);
            border: 3px solid var(--jade);
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: inset 0 0 28px rgba(0,230,118,0.18), 0 0 18px rgba(0,230,118,0.1);
        }
        /* Anillos interiores del calendario */
        #radar-circular-container::before {
            content: '';
            position: absolute;
            inset: 18%;
            border: 1px solid rgba(0,230,118,0.15);
            border-radius: 50%;
            pointer-events: none;
        }
        #radar-circular-container::after {
            content: '';
            position: absolute;
            inset: 38%;
            border: 1px solid rgba(201,162,39,0.12);
            border-radius: 50%;
            pointer-events: none;
        }

        @keyframes sweep {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        #radar-sweep-line {
            position: absolute;
            top: 50%; left: 50%;
            width: 50%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,230,118,0) 0%, rgba(0,230,118,0.95) 100%);
            transform-origin: left center;
            animation: sweep 3s linear infinite;
            box-shadow: 0 0 5px var(--jade);
        }

        .radar-node {
            position: absolute;
            font-size: 18px;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
        }
        @keyframes pulse-node {
            0%   { opacity: 1;   transform: translate(-50%, -50%) scale(1);   }
            50%  { opacity: 0.45; transform: translate(-50%, -50%) scale(1.35); }
            100% { opacity: 1;   transform: translate(-50%, -50%) scale(1);   }
        }
        .radar-node .pulse-circle { animation: pulse-node 1.8s infinite; }

        .radar-node.router    { color: var(--jade);   text-shadow: 0 0 8px var(--jade);   }
        .radar-node.smarttv   { color: #bb86fc;       text-shadow: 0 0 8px #bb86fc;       }
        .radar-node.asistente { color: var(--gold);   text-shadow: 0 0 8px var(--gold);   }
        .radar-node.camara    { color: #ff5252;       text-shadow: 0 0 8px #ff5252;       }
        .radar-node.celular   { color: #e0e0e0;       text-shadow: 0 0 8px #e0e0e0;       }
        .radar-node.db        { color: var(--danger); text-shadow: 0 0 8px var(--danger);  }

        .radar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 0.8em;
            color: var(--text-dim);
            opacity: 0.9;
        }
        .radar-header b { color: var(--jade); }

        #radar-logs-panel {
            flex-grow: 1;
            background: var(--obsidian);
            border: 1px solid #111e11;
            padding: 14px;
            height: 250px;
            overflow-y: auto;
            font-size: 12px;
            color: #5a9a6a;
            scrollbar-width: thin;
            scrollbar-color: var(--jade-dark) transparent;
        }
        #radar-logs-panel p { margin: 0 0 6px 0; }
        #radar-logs-panel b { color: #c8ffd8; }

        .log-vivos { color: var(--jade); font-weight: bold; }
        .log-muertos { color: #ff5252; }

        /* ================================================
           RESULTADO IP
           ================================================ */
        #resultado-ip {
            max-width: 820px;
            margin: 18px auto;
            position: relative;
            z-index: 10;
        }

        /* ================================================
           BOOT SEQUENCE
           ================================================ */
        #boot-overlay {
            position: fixed;
            inset: 0;
            background: #010301;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.9s ease;
        }
        #boot-overlay.oculto {
            opacity: 0;
            pointer-events: none;
        }
        #boot-terminal {
            width: 560px;
            max-width: 88vw;
        }
        #boot-terminal p {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #3a6a4a;
            margin: 0 0 5px 0;
            opacity: 0;
            transition: opacity 0.18s;
        }
        #boot-terminal p.visible { opacity: 1; }
        #boot-terminal .ok   { color: #00e676; }
        #boot-terminal .warn { color: #c9a227; }
        #boot-terminal .dim  { color: #1e3a2e; }
        #boot-terminal .final {
            color: #c9a227;
            font-size: 14px;
            margin-top: 10px;
        }
        #boot-cursor {
            display: inline-block;
            width: 8px;
            height: 13px;
            background: #00e676;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink-cur 0.65s infinite;
        }
        @keyframes blink-cur {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- CABECERA -->
        <header class="rs-header">
            <p class="rs-eyebrow">⬡ &nbsp; SISTEMA DE INTELIGENCIA DIGITAL &nbsp; ⬡</p>
            <h1 class="glitch" data-text="RULO SEC — LA RED NO OLVIDA. YO TAMPOCO">
                RULO SEC — LA RED NO OLVIDA. YO TAMPOCO
            </h1>
        </header>

        <!-- DIVISOR -->
        <div class="greca"><span class="greca-label">◈ &nbsp; INTERCEPTOR DE CREDENCIALES &nbsp; ◈</span></div>

        <!-- TRAMPA DE LOGIN -->
        <div class="login-trap panel">
            <p class="trap-title">⚠ &nbsp; AUTENTICACIÓN REQUERIDA &nbsp; ⚠</p>
            <input type="text"     id="user-input" placeholder="// usuario">
            <input type="password" id="pass-input" placeholder="// contraseña">
            <div class="btn-login-disabled">INICIAR SESIÓN</div>
        </div>

        <!-- DIVISOR -->
        <div class="greca"><span class="greca-label">◈ &nbsp; MÓDULOS ACTIVOS &nbsp; ◈</span></div>

        <!-- BOTONES -->
        <button id="btn-ip">CONSULTAR IP &amp; GEOLOCALIZACIÓN</button>
        <button id="btn-escaner">ESCANEAR DISPOSITIVOS EN RED LOCAL</button>
        <button id="btn-webrtc">DETECTAR IP REAL — FUGA WebRTC</button>

    </div>

    <!-- RESULTADO IP (fuera del container, igual que el original) -->
    <div id="resultado-ip"></div>

    <!-- BOOT SEQUENCE OVERLAY -->
    <div id="boot-overlay">
        <div id="boot-terminal">
            <span id="boot-cursor"></span>
        </div>
    </div>

    <!-- CANVAS QUETZALCÓATL — INTOCABLE -->
    <div id="canvas-container">
        <svg id="screen" width="100%" height="100%"></svg>
    </div>

    <script src="script.js"></script>

    <script>
    /* ================================================
       BOOT SEQUENCE
       ================================================ */
    (function () {
        const LINEAS = [
            { html: '[QUETZALCÓATL v2.0] Inicializando núcleo de inteligencia...', cls: '' },
            { html: '[KL·01]  Keylogger &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="ok">ACTIVO</span>', cls: '' },
            { html: '[BIO·02] Biometría conductual &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="ok">ACTIVO</span>', cls: '' },
            { html: '[ARP·03] Escáner de red local &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="ok">ACTIVO</span>', cls: '' },
            { html: '[WRT·04] Detector de fuga WebRTC &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="ok">ACTIVO</span>', cls: '' },
            { html: '[GEO·05] Geolocalización OSINT &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span class="ok">ACTIVO</span>', cls: '' },
            { html: '<span class="dim">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</span>', cls: '' },
            { html: '<span class="final">[SISTEMA] La red no olvida.&nbsp; Bienvenido, operador.</span>', cls: '' },
        ];

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        async function boot() {
            const overlay  = document.getElementById('boot-overlay');
            const terminal = document.getElementById('boot-terminal');
            const cursor   = document.getElementById('boot-cursor');

            for (const linea of LINEAS) {
                await sleep(255);
                const p = document.createElement('p');
                p.innerHTML = linea.html;
                terminal.insertBefore(p, cursor);
                await sleep(20);
                p.classList.add('visible');
            }

            await sleep(850);
            overlay.classList.add('oculto');
            setTimeout(() => overlay.remove(), 950);
        }

        document.addEventListener('DOMContentLoaded', boot);
    })();

    /* ================================================
       PIEDRA DEL SOL EN EL RADAR
       ================================================ */
    (function () {
        function buildSunSVG() {
            const cx = 125, cy = 125;
            let g = '';

            // Anillos concéntricos
            [114, 99, 79, 59, 39, 21].forEach(r => {
                g += `<circle cx="125" cy="125" r="${r}"/>`;
            });

            // 20 marcadores del tonalpohualli (ticks entre r=101 y r=112)
            for (let i = 0; i < 20; i++) {
                const a = (i * 18 - 90) * Math.PI / 180;
                const x1 = (cx + 101 * Math.cos(a)).toFixed(1);
                const y1 = (cy + 101 * Math.sin(a)).toFixed(1);
                const x2 = (cx + 112 * Math.cos(a)).toFixed(1);
                const y2 = (cy + 112 * Math.sin(a)).toFixed(1);
                g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            }

            // 20 puntos de días a r=90
            for (let i = 0; i < 20; i++) {
                const a = (i * 18 - 90) * Math.PI / 180;
                const x = (cx + 90 * Math.cos(a)).toFixed(1);
                const y = (cy + 90 * Math.sin(a)).toFixed(1);
                g += `<circle cx="${x}" cy="${y}" r="2" fill="#00e676" stroke="none"/>`;
            }

            // 4 marcas cardinales (gruesas, r=62-77)
            for (let i = 0; i < 4; i++) {
                const a = (i * 90 - 90) * Math.PI / 180;
                const x1 = (cx + 62 * Math.cos(a)).toFixed(1);
                const y1 = (cy + 62 * Math.sin(a)).toFixed(1);
                const x2 = (cx + 77 * Math.cos(a)).toFixed(1);
                const y2 = (cy + 77 * Math.sin(a)).toFixed(1);
                g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2"/>`;
            }

            // 4 marcas diagonales (finas, r=62-77)
            for (let i = 0; i < 4; i++) {
                const a = (i * 90 - 45) * Math.PI / 180;
                const x1 = (cx + 62 * Math.cos(a)).toFixed(1);
                const y1 = (cy + 62 * Math.sin(a)).toFixed(1);
                const x2 = (cx + 77 * Math.cos(a)).toFixed(1);
                const y2 = (cy + 77 * Math.sin(a)).toFixed(1);
                g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            }

            // 8 rayos del sol (r=22-38)
            for (let i = 0; i < 8; i++) {
                const a = (i * 45 - 90) * Math.PI / 180;
                const x1 = (cx + 22 * Math.cos(a)).toFixed(1);
                const y1 = (cy + 22 * Math.sin(a)).toFixed(1);
                const x2 = (cx + 38 * Math.cos(a)).toFixed(1);
                const y2 = (cy + 38 * Math.sin(a)).toFixed(1);
                g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
            }

            const svg = `<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#00e676" stroke-width="0.7" opacity="0.18">${g}</g></svg>`;
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        function aplicar(el) {
            el.style.backgroundImage =
                `url("${buildSunSVG()}"), radial-gradient(circle at 50% 50%, #001a0d 0%, #000a05 60%, #000000 100%)`;
            el.style.backgroundSize    = '100% 100%, 100% 100%';
            el.style.backgroundRepeat  = 'no-repeat, no-repeat';
        }

        // Observar cuando el radar se cree en el DOM
        const obs = new MutationObserver(() => {
            const el = document.getElementById('radar-circular-container');
            if (el && !el.dataset.sunApplied) {
                el.dataset.sunApplied = '1';
                aplicar(el);
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            obs.observe(document.body, { childList: true, subtree: true });
        });
    })();
    </script>
</body>
</html>
